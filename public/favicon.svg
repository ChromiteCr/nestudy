<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    nestudy 标记：|\| —— 两根立柱 + 一条斜撑。
    既是 n，也是画板的基本形（两个节点与连接它们的一条边）。
    三笔留缝：大尺寸下看得出是构造出来的，16px 下自然填实成一个 N。

    颜色写成 fill 属性、只用 CSS 覆盖暗色：favicon 会被各种东西读
    （浏览器、RSS、链接预览、系统书签缩略图），不支持 CSS 变量的渲染器
    拿到 var() 会 fallback 成黑色——底板与笔画一起变黑，整个标记消失。
    属性打底、CSS 加强，最差情况也是一张正确的浅色版。
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .plate { fill: #d5dad7 }
      .mark { fill: #1e231f }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="5" fill="#2c332f"/>
  <g class="mark" fill="#f7f9f8">
    <path d="M6 7h4v18H6z"/>
    <path d="M22 7h4v18h-4z"/>
    <path d="M12.77 7.55 22.55 22.23 19.23 24.45 9.45 9.77Z"/>
  </g>
</svg>
