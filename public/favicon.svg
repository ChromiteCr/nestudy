<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    nestudy 标记：|\\| —— 四笔各自独立：两根立柱 + 两条平行斜撑。
    立柱 1.6 比斜撑 2.6 细，斜撑才是主笔；四笔之间的三处缝均分，
    所以立柱收细之后缝会跟着变宽，16px 下反而比粗立柱更分得开。
    立柱不再往下探到 1.2：128px 下更利落，但 16px 时立柱基本消失。

    颜色写成 fill 属性、只用 CSS 覆盖暗色：favicon 会被各种东西读
    （浏览器、RSS、链接预览、系统书签缩略图），不支持 CSS 变量的渲染器
    拿到 var() 会 fallback 成黑色——底板与笔画一起变黑，整个标记消失。
    属性打底、CSS 加强，最差情况也是一张正确的浅色版。
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .plate { fill: #d5dad7 }
      .mark { fill: #1e231f }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="5" fill="#2c332f"/>
  <g class="mark" fill="#f7f9f8">
    <path d="M6 6h1.6v20H6z"/>
    <path d="M24.4 6H26v20h-1.6z"/>
    <path d="M11.78 6 18.48 25.14 16.03 26 9.33 6.86Z"/>
    <path d="M15.97 6 22.67 25.14 20.22 26 13.52 6.86Z"/>
  </g>
</svg>
