<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    nestudy 标记：|\\| —— 四笔各自独立：两根立柱 + 被中断切开的两段斜撑。
    既是 n，也是画板的基本形（两个节点与连接它们的一条边）。
    中断从 32px 起看得见，16px 下自然合成一个 N——同一个形两个尺度都成立。
    立柱 1.8 比斜撑 2.6 细：边是主角，节点是端点，层次照着这个来。

    颜色写成 fill 属性、只用 CSS 覆盖暗色：favicon 会被各种东西读
    （浏览器、RSS、链接预览、系统书签缩略图），不支持 CSS 变量的渲染器
    拿到 var() 会 fallback 成黑色——底板与笔画一起变黑，整个标记消失。
    属性打底、CSS 加强，最差情况也是一张正确的浅色版。
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .plate { fill: #d5dad7 }
      .mark { fill: #1e231f }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="5" fill="#2c332f"/>
  <g class="mark" fill="#f7f9f8">
    <path d="M6 6h1.8v20H6z"/>
    <path d="M24.2 6H26v20h-1.8z"/>
    <path d="M9.48 6 16.31 14.33 14.3 15.97 7.47 7.65Z"/>
    <path d="M17.7 16.03 24.53 24.35 22.52 26 15.69 17.67Z"/>
  </g>
</svg>
